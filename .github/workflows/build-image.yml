name: Build and publish Traccar image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream Traccar branch, tag, or commit SHA to build
        required: true
        default: master
        type: string
      image_tag:
        description: Docker tag to publish; use auto for VERSION-dev.SHORT_SHA
        required: true
        default: auto
        type: string

permissions: {}

concurrency:
  group: traccar-image-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build-source:
    name: Build Traccar source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source_revision: ${{ steps.source.outputs.revision }}
      image_tag: ${{ steps.source.outputs.image_tag }}

    steps:
      - name: Checkout Traccar source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: traccar/traccar
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
          path: traccar-source

      - name: Record source revision and resolve image tag
        id: source
        working-directory: traccar-source
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          commit_timestamp="$(git show -s --format=%ct HEAD)"
          short_revision="${revision:0:7}"

          if [[ "$REQUESTED_IMAGE_TAG" == "auto" ]]; then
            version="$(sed -nE 's/.*Implementation-Version"?[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' build.gradle | head -n 1)"
            if [[ -z "$version" ]]; then
              echo "Unable to determine Traccar version from build.gradle"
              exit 1
            fi
            image_tag="${version}-dev.${short_revision}"
          else
            image_tag="$REQUESTED_IMAGE_TAG"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $image_tag"
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "commit_timestamp=$commit_timestamp" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: $image_tag"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build and test Traccar server
        working-directory: traccar-source
        run: ./gradlew build --no-daemon --stacktrace

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: traccar-source/traccar-web/package-lock.json

      - name: Build Traccar web app
        working-directory: traccar-source/traccar-web
        run: npm ci && npm run build

      - name: Create deterministic Docker payload
        working-directory: traccar-source
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.commit_timestamp }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/payload" "$GITHUB_WORKSPACE/traccar-other.zip"
          mkdir -p "$GITHUB_WORKSPACE/payload"/{conf,lib,schema,templates,web,data,logs}

          cp target/tracker-server.jar "$GITHUB_WORKSPACE/payload/"
          cp target/lib/* "$GITHUB_WORKSPACE/payload/lib/"
          cp schema/* "$GITHUB_WORKSPACE/payload/schema/"
          cp -r templates/* "$GITHUB_WORKSPACE/payload/templates/"
          cp setup/traccar.xml "$GITHUB_WORKSPACE/payload/conf/"
          cp setup/README.txt "$GITHUB_WORKSPACE/payload/"
          cp -r traccar-web/build/* "$GITHUB_WORKSPACE/payload/web/"

          find "$GITHUB_WORKSPACE/payload" -exec touch --date="@$SOURCE_DATE_EPOCH" {} +
          (
            cd "$GITHUB_WORKSPACE/payload"
            find . -mindepth 1 \( -type f -o -type d -empty \) -print \
              | LC_ALL=C sort \
              | zip -X -q "$GITHUB_WORKSPACE/traccar-other.zip" -@
          )

      - name: Upload Docker payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: traccar-other-payload
          path: traccar-other.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  smoke-test:
    name: Smoke test linux/amd64 image
    needs: build-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout image builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Docker payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: traccar-other-payload
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build local test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64
          load: true
          tags: local/traccar:${{ needs.build-source.outputs.image_tag }}
          cache-from: type=gha,scope=traccar-amd64
          cache-to: type=gha,mode=max,scope=traccar-amd64
          provenance: false
          sbom: false

      - name: Create root-owned smoke-test volumes
        run: |
          docker volume create traccar-smoke-logs
          docker volume create traccar-smoke-data

      - name: Start smoke-test container
        run: >-
          docker run -d
          --name traccar-smoke
          -p 18082:8082
          --mount source=traccar-smoke-logs,target=/opt/traccar/logs
          --mount source=traccar-smoke-data,target=/opt/traccar/data
          local/traccar:${{ needs.build-source.outputs.image_tag }}

      - name: Probe Traccar health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..180}; do
            if curl --fail --silent --show-error http://127.0.0.1:18082/api/health; then
              exit 0
            fi

            state="$(docker inspect --format '{{.State.Status}}' traccar-smoke 2>/dev/null || true)"
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              docker logs traccar-smoke || true
              exit 1
            fi
            sleep 2
          done

          docker logs traccar-smoke || true
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: |
          docker rm -f traccar-smoke 2>/dev/null || true
          docker volume rm traccar-smoke-logs traccar-smoke-data 2>/dev/null || true

  publish:
    name: Publish image to GHCR
    needs: [build-source, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/banghasan/traccar

    steps:
      - name: Checkout image builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Docker payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: traccar-other-payload
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure image tag is unused
        env:
          IMAGE_TAG: ${{ needs.build-source.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" 2>&1)"; then
            echo "Image tag already exists: $IMAGE_NAME:$IMAGE_TAG"
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|no such manifest|not found|name unknown|404' <<<"$output"; then
            echo "Unable to verify that image tag is unused: $IMAGE_NAME:$IMAGE_TAG"
            echo "$output"
            exit 1
          fi

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.build-source.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.build-source.outputs.source_revision }}
            org.opencontainers.image.version=${{ needs.build-source.outputs.image_tag }}
            io.banghasan.traccar.source-ref=${{ inputs.source_ref }}
          cache-from: type=gha,scope=traccar-amd64
          cache-to: type=gha,mode=max,scope=traccar-amd64
          provenance: mode=max
          sbom: true

      - name: Generate image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write build summary
        env:
          IMAGE_TAG: ${{ needs.build-source.outputs.image_tag }}
          SOURCE_REVISION: ${{ needs.build-source.outputs.source_revision }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Traccar image published"
            echo
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Requested tag: \`${{ inputs.image_tag }}\`"
            echo "- Source ref: \`${{ inputs.source_ref }}\`"
            echo "- Source revision: \`${SOURCE_REVISION}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
