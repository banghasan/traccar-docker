name: traccar

services:
  traccar:
    image: ghcr.io/banghasan/traccar:${TRACCAR_IMAGE_TAG:?set TRACCAR_IMAGE_TAG}
    platform: linux/amd64
    container_name: traccar
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      DATABASE_URL: "jdbc:mysql://${MYSQL_HOST:?set MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-traccar}?zeroDateTimeBehavior=round&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true&autoReconnect=true&useUnicode=yes&characterEncoding=UTF-8&sessionVariables=sql_mode=''"
      DATABASE_USER: "${MYSQL_USER:?set MYSQL_USER}"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD}"
    ports:
      - "8082:8082"
      # Add one TCP/UDP pair for every protocol port used by your devices.
      - "5000:5000/tcp"
      - "5000:5000/udp"
    volumes:
      - traccar_logs:/opt/traccar/logs
      - traccar_data:/opt/traccar/data
    networks:
      - backend

volumes:
  traccar_logs:
  traccar_data:

networks:
  backend:
    external: true
    name: ${DOCKER_NETWORK:-backend}
